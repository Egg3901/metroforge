    <script src="releases.js"></script>
    <script>
      (function () {
        var list = document.getElementById('release-list');

        function escapeHtml(s) {
          return s.replace(/[&<>]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
          });
        }

        // Minimal markdown-ish render: strip the auto-generated HTML comment,
        // turn "* " bullets into <li>, headings into bold lines.
        function renderBody(body) {
          if (!body) return '<p>No notes for this release.</p>';
          var cleaned = body.replace(/<!--[\s\S]*?-->/g, '').trim();
          var lines = cleaned.split('\n');
          var html = '';
          var inList = false;
          lines.forEach(function (line) {
            var trimmed = line.trim();
            if (!trimmed) return;
            if (/^#{1,4}\s/.test(trimmed)) {
              if (inList) { html += '</ul>'; inList = false; }
              html += '<p><strong>' + escapeHtml(trimmed.replace(/^#{1,4}\s/, '')) + '</strong></p>';
              return;
            }
            if (/^\*\s/.test(trimmed)) {
              if (!inList) { html += '<ul>'; inList = true; }
              html += '<li>' + escapeHtml(trimmed.replace(/^\*\s/, '')) + '</li>';
              return;
            }
            if (inList) { html += '</ul>'; inList = false; }
            html += '<p>' + escapeHtml(trimmed) + '</p>';
          });
          if (inList) html += '</ul>';
          return html || '<p>No notes for this release.</p>';
        }

        function formatDate(iso) {
          var d = new Date(iso);
          return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }

        MetroForgeReleases.fetchReleases(10).then(function (releases) {
          if (!releases.length) throw new Error('no releases');
          list.innerHTML = releases.map(function (r) {
            var assets = MetroForgeReleases.platformAssets(r);
            var links = ['<a href="' + r.html_url + '">Release notes</a>'];
            if (assets.windows) links.push('<a href="' + assets.windows.browser_download_url + '">Windows</a>');
            if (assets.macos) links.push('<a href="' + assets.macos.browser_download_url + '">macOS</a>');
            if (assets.linux) links.push('<a href="' + assets.linux.browser_download_url + '">Linux</a>');
            return (
              '<article class="release">' +
                '<div class="release-head">' +
                  '<span class="tag">' + escapeHtml(r.tag_name) + '</span>' +
                  '<span class="date">' + formatDate(r.published_at) + '</span>' +
                '</div>' +
                '<div class="release-body">' + renderBody(r.body) + '</div>' +
                '<div class="release-links">' + links.join('') + '</div>' +
              '</article>'
            );
          }).join('');
        }).catch(function () {
          list.innerHTML =
            '<p class="load-error">Could not load releases right now. See the full history on ' +
            '<a href="' + MetroForgeReleases.RELEASES_PAGE + '">GitHub</a>.</p>';
        });
      })();
    </script>
  </body>
