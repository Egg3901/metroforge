# Lean self-hosted CI (Woodpecker on Hetzner, workflows.[REDACTED]game.com).
# Storefront-only repo: typecheck + build gate correctness; deploy builds dist/.

when:
  - event: pull_request
  - event: push
    branch: [master]

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git
    settings:
      lfs: false

steps:
  install:
    image: sh
    commands: [npm ci --no-audit --no-fund]

  typecheck:
    image: sh
    commands: [npm run typecheck]
    depends_on: [install]

  build:
    image: sh
    commands: [npm run build]
    depends_on: [install]
